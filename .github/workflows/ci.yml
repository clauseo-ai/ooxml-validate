name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A new push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # Build and test on the three systems the tool is released for. The tests build their own .docx files, so nothing
  # else is needed on the runner.
  test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    steps:
      # Actions are pinned by commit SHA, with the release tag in a comment. Update both together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build OoxmlValidate.slnx --configuration Release

      - name: Test
        run: dotnet test OoxmlValidate.slnx --configuration Release --no-build

  # The packaging files: the workflows themselves, the formula template and its filler, and a self-contained publish
  # of the tool for this runner's system, run once to show it starts.
  packaging:
    name: packaging checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint runs from its pinned container image, so nothing is installed on the runner.
      - name: Lint the workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - name: Check the shell scripts
        run: |
          sh -n packaging/homebrew/fill-formula.sh
          shellcheck packaging/homebrew/fill-formula.sh

      - name: Check the formula template
        run: |
          ruby -c packaging/homebrew/ooxml-validate.rb
          work="$(mktemp -d)"
          hash="$(printf 'a%.0s' $(seq 64))"
          for rid in osx-arm64 osx-x64 linux-arm64 linux-x64; do
            printf '%s  ooxml-validate-%s.tar.gz\n' "$hash" "$rid" > "$work/ooxml-validate-$rid.tar.gz.sha256"
          done
          sh packaging/homebrew/fill-formula.sh "$work" 0.1.0 "$work/ooxml-validate.rb"
          ruby -c "$work/ooxml-validate.rb"
          if grep -Eq '@[A-Z0-9_]+@' "$work/ooxml-validate.rb"; then echo "placeholders left" >&2; exit 1; fi

